<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Copa Catalana Cadet 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icona de la bicicleta blava -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/512/1A73E8/bicycle.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/1A73E8/bicycle.png">
    <meta name="theme-color" content="#dc2626">

    <style>
        .cursa-card { transition: all 0.2s; }
        .cursa-card:active { transform: scale(0.98); }
        .btn-disabled { opacity: 0.2; grayscale: 1; pointer-events: none; }
        /* Animació per al text de propera cursa */
        .due-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-100 pb-10 font-sans text-slate-900">

    <div class="max-w-md mx-auto">
        <!-- Capçalera modificada segons el teu codi -->
        <header class="bg-blue-600 text-white p-6 shadow-lg text-center mb-6 rounded-b-3xl">
            <h1 class="text-2xl font-black tracking-wider text-white uppercase leading-none">Copa Catalana 2026</h1>
            <p class="text-[10px] font-bold opacity-90 uppercase tracking-[0.2em] mt-2">Cadet</p>
            <p class="text-[10px] font-bold opacity-90 uppercase tracking-[0.2em] mt-2">ProRide Jufré Cycling Team</p>
        </header>

        <!-- Llista de Curses -->
        <div id="llista-curses" class="px-4 space-y-5">
            <!-- Es genera automàticament -->
         <script>
        // --- DADES DE LES CURSES (LES TEVES DADES ACTUALITZADES) ---
        const curses = [
            { 
                data: "23/05/2026", 
                nom: "XII MEMORIAL JOSEP SEGÚ", 
                lloc: "La Garriga",
                maps: "https://www.google.com/maps/search/?api=1&query=El+Passeig+La+Garriga",
                web: "https://www.ciclisme.cat/cursa/carretera/xii-memorial-josep-segu-cadet",
                pdf: "https://hipocamp.github.io/copacadet2026/instruccions_lagarriga.pdf",
                fotos: "https://drive.google.com/drive/folders/1EcFZvGEbFthirTpSByyLqJFvLpJw43GU?usp=drive_link"
            },
            { 
                data: "13/06/2026", 
                nom: "Campionat de Catalunya de CRI", 
                lloc: "El Poal",
                maps: "https://www.google.com/maps/search/?api=1&query=El+Poal",
                web: "https://www.ciclisme.cat/cursa/carretera/campionat-de-catalunya-de-cri-0",
                pdf: "",
                fotos: ""
            },
            { 
                data: "28/06/2026", 
                nom: "Trofeu Verbena Sant Joan",
                lloc: "Montornès del Vallès",
                maps: "https://www.google.com/maps/search/?api=1&query=Carrer+Federico+Garcia+Lorca+Montornès+del+Vallès",
                web: "https://www.ciclisme.cat/cursa/carretera/trofeo-verbena-san-juan",
                pdf: "https://hipocamp.github.io/copacadet2026/Info_verbena.pdf",
                fotos: ""
            },
            { 
                data: "11/07/2026", 
                nom: "Copa Catalana Cadet - Reus", 
                lloc: "Reus",
                maps: "https://www.google.com/maps/search/?api=1&query=Carrer+Hongria+Reus",
                web: "https://www.ciclisme.cat/cursa/carretera/copa-catalana-cadet-reus",
                pdf: "https://hipocamp.github.io/copacadet2026/instruccions_reus.pdf",
                fotos: ""
            },
            { 
                data: "19/07/2026", 
                nom: "II Trofeu Naut Aran", 
                lloc: "Baqueira 1500 (Naut Aran)",
                maps: "https://maps.app.goo.gl/jQ7rvmDUKhK6ZaXC7",
                web: "https://www.ciclisme.cat/cursa/carretera/ii-trofeu-naut-aran-cadet",
                pdf: "https://hipocamp.github.io/copacadet2026/instruccions_aran.pdf",
                fotos: ""
            },
            { 
                data: "01/08/2026", 
                nom: "3a Edició Critèrium Ivan Graït", 
                lloc: "Ivars de Noguera",
                maps: "https://maps.app.goo.gl/jrYpMcJ1YXbgkzCF8",
                web: "https://www.ciclisme.cat/cursa/carretera/3a-edicio-criterium-ivan-grait-cadet",
                pdf: "https://hipocamp.github.io/copacadet2026/instruccions_ivars.pdf",
                fotos: ""
            },
            { 
                data: "15/08/2026", 
                nom: "61è GRAN PREMI FESTA MAJOR MALGRAT DE MAR", 
                lloc: "Malgrat de Mar",
                maps: "https://www.google.com/maps/search/?api=1&query=Avinguda+Costa+Brava+Malgrat+de+Mar",
                web: "https://www.ciclisme.cat/cursa/carretera/61e-gran-premi-festa-major-malgrat-de-mar-cadet",
                pdf: "https://hipocamp.github.io/copacadet2026/info_malgrat.pdf",
                fotos: ""
            },
            { 
                data: "23/08/2026", 
                nom: "V MEMORIAL PEDRO TIRADO", 
                lloc: "Amposta",
                maps: "https://www.google.com/maps/search/?api=1&query=Carrer+Brasil+Amposta",
                web: "https://www.ciclisme.cat/cursa/carretera/v-memorial-pedro-tirado",
                pdf: "https://hipocamp.github.io/copacadet2026/info_ptirado.pdf",
                fotos: ""
            },
            { 
                data: "30/08/2026", 
                nom: "49è Trofeu Quirze Martí", 
                lloc: "Barcelona",
                maps: "https://www.google.com/maps/search/?api=1&query=Carrer+Riego+2+Barcelona",
                web: "https://www.ciclisme.cat/cursa/carretera/49e-trofeu-quirze-marti",
                pdf: "https://hipocamp.github.io/copacadet2026/info_quirzemarti.pdf",
                fotos: ""
            },
             { 
                data: "20/09/2026", 
                nom: "VXI TROFEU ISAAC GÁLVEZ", 
                lloc: "Vilanova i la Geltrú",
                maps: "https://maps.app.goo.gl/wVdHJUt34YXBdotQ6",
                web: "https://www.ciclisme.cat/cursa/carretera/vxi-trofeu-isaac-galvez",
                pdf: "https://hipocamp.github.io/copacadet2026/info_isaacgalvez.pdf",
                fotos: "https://drive.google.com/drive/folders/1osKdk9kTCmV17x8HK275fH-HFzlmZree?usp=sharing"
            },
            { 
                data: "20/09/2026", 
                nom: "TROFEU ISAAC GÁLVEZ - MAMIS i PAPIS", 
                lloc: "Vilanova i la Geltrú",
                maps: "https://maps.app.goo.gl/wVdHJUt34YXBdotQ6",
                web: "https://www.ciclisme.cat/cursa/carretera/trofeu-isaac-galvez-papis-i-mamis",
                pdf: "",
                fotos: ""
            },
            { 
                data: "27/09/2026", 
                nom: "GP Ajuntament de Sant Boi", 
                lloc: "Sant Boi de Llobregat",
                maps: "https://goo.gl/maps/MwbKboByiVVWyRQA9",
                web: "https://www.ciclisme.cat/cursa/carretera/copa-catalana-cadet-gp-ajuntament-de-sant-boi-cadet",
                pdf: "https://hipocamp.github.io/copacadet2026/info_santboi.pdf",
                fotos: ""
            }
        ];

        const container = document.getElementById('llista-curses');

        // Funció per saber si la cursa ja ha passat
        function esCursaPassada(dataString) {
            const [dia, mes, any] = dataString.split('/');
            const dataCursa = new Date(any, mes - 1, dia);
            const avui = new Date();
            avui.setHours(0,0,0,0);
            return dataCursa < avui;
        }

        curses.forEach(cursa => {
            const jaFeta = esCursaPassada(cursa.data);
            
            // Lògica de colors i estats
            const colorBorda = jaFeta ? "border-red-500 bg-red-50/20" : "border-green-500 bg-white";
            const badge = jaFeta ? 
                `<span class="bg-red-100 text-red-600 text-[8px] font-black px-2 py-0.5 rounded-full uppercase">Finalitzada</span>` : 
                `<span class="bg-green-100 text-green-600 text-[8px] font-black px-2 py-0.5 rounded-full uppercase due-pulse">Propera</span>`;

            const card = document.createElement('div');
            card.className = `cursa-card rounded-3xl shadow-sm border-l-[12px] p-5 ${colorBorda} border border-slate-200`;
            
            const pdfClass = cursa.pdf === "" ? "btn-disabled" : "";
            const fotosClass = cursa.fotos === "" ? "btn-disabled" : "";

            card.innerHTML = `
                <div class="mb-4">
                    <div class="flex justify-between items-start">
                        <p class="text-slate-500 font-black text-[10px] uppercase tracking-widest">${cursa.data}</p>
                        ${badge}
                    </div>
                    <h2 class="text-xl font-bold text-slate-800 leading-tight mt-1">${cursa.nom}</h2>
                    <p class="text-slate-400 text-xs font-bold mt-1 uppercase tracking-tight">📍 ${cursa.lloc}</p>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <!-- BOTÓ MAPS -->
                    <a href="${cursa.maps}" target="_blank" class="flex flex-col items-center justify-center bg-blue-500 text-white py-3 rounded-2xl shadow-lg shadow-blue-100">
                        <span class="text-lg">📍</span>
                        <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Com anar-hi</span>
                    </a>
                    
                    <!-- BOTÓ INFO WEB -->
                    <a href="${cursa.web}" target="_blank" class="flex flex-col items-center justify-center bg-slate-800 text-white py-3 rounded-2xl shadow-lg shadow-slate-200">
                        <span class="text-lg">🌐</span>
                        <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Inscripció</span>
                    </a>

                    <!-- BOTÓ PDF (Instruccions) -->
                    <a href="${cursa.pdf}" target="_blank" class="${pdfClass} flex flex-col items-center justify-center bg-orange-500 text-white py-3 rounded-2xl shadow-lg shadow-orange-100">
                        <span class="text-lg">📄</span>
                        <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Convocatòria</span>
                    </a>

                    <!-- BOTÓ FOTOS -->
                    <a href="${cursa.fotos}" target="_blank" class="${fotosClass} flex flex-col items-center justify-center bg-emerald-500 text-white py-3 rounded-2xl shadow-lg shadow-emerald-100">
                        <span class="text-lg">📸</span>
                        <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Fotos Cursa</span>
                    </a>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
