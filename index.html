<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Júnior 2027 - Autovivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icona de la bicicleta vermella -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/512/DC2626/bicycle.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/DC2626/bicycle.png">
    <meta name="theme-color" content="#000000">

    <style>
        .cursa-card { transition: all 0.2s; }
        .cursa-card:active { transform: scale(0.98); }
        .btn-disabled { opacity: 0.15; filter: grayscale(1); pointer-events: none; }
        .due-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-zinc-950 pb-10 font-sans text-slate-100">

    <div class="max-w-md mx-auto">
        <!-- Capçalera Vermella Autovivo -->
        <header class="bg-red-600 text-white p-6 shadow-xl text-center rounded-b-3xl border-b border-red-500/30">
            <h1 class="text-2xl font-black tracking-wider text-white uppercase leading-none">CC Sant Boi Autovivo</h1>
            <p class="text-[10px] font-black opacity-90 uppercase tracking-[0.2em] mt-2 text-zinc-900 bg-white/20 inline-block px-3 py-0.5 rounded-full">Junior</p>
            <p class="text-[10px] font-bold opacity-90 uppercase tracking-[0.2em] mt-2 block">Temporada 2027</p>
        </header>

        <!-- Navegació per Categories (Tabs en fons fosc) -->
        <nav class="flex justify-around bg-zinc-900 mx-4 mt-4 p-1.5 rounded-2xl shadow-lg border border-zinc-800">
            <button onclick="canviarCategoria('entrenaments')" id="tab-entrenaments" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all text-zinc-400">
                🏋️ Entrenaments
            </button>
            <button onclick="canviarCategoria('copa')" id="tab-copa" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all text-zinc-400">
                🏆 Copa Catalana
            </button>
            <button onclick="canviarCategoria('sortides')" id="tab-sortides" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all text-zinc-400">
                🚴 Sortides
            </button>
        </nav>

        <!-- Contenidor de Llista de Curses / Esdeveniments -->
        <div id="llista-esdeveniments" class="px-4 space-y-5 mt-5">
            <!-- Es genera automàticament -->
        </div>
    </div>

    <script>
        // --- DADES DE LES CATEGORIES ---
        const dades = {
            entrenaments: [
                {
                    data: "18/10/2026",
                    nom: "Primera convocatòria",
                    lloc: "Sant Boi de Llobregat",
                    maps: "https://maps.app.goo.gl/6YYsCHeQjyoAo7dz8",
                    web: "",
                    pdf: "https://hipocamp.github.io/santboi-autovivo-junior2027/primera_convocatoria.pdf",
                    fotos: ""
                }
            ],
            copa: [
                { 
                    data: "", 
                    nom: "Per determinar", 
                    lloc: "",
                    maps: "https://maps.google.com",
                    web: "https://www.ciclisme.cat/",
                    pdf: "",
                    fotos: ""
                }
            ],
            sortides: [
                {
                    data: "",
                    nom: "Per determinar",
                    lloc: "",
                    maps: "https://maps.google.com",
                    web: "",
                    pdf: "",
                    fotos: ""
                }
            ],
        };

        let categoriaActual = 'copa';

        function esEsdevenimentPassat(dataString) {
            if (!dataString) return false;
            const [dia, mes, any] = dataString.split('/');
            const dataEsdeveniment = new Date(any, mes - 1, dia);
            const avui = new Date();
            avui.setHours(0,0,0,0);
            return dataEsdeveniment < avui;
        }

        function canviarCategoria(categoria) {
            categoriaActual = categoria;
            
            // Pestanya activa: vermell intens Autovivo (bg-red-600)
            ['entrenaments', 'copa', 'sortides'].forEach(cat => {
                const btn = document.getElementById(`tab-${cat}`);
                if (cat === categoria) {
                    btn.className = "flex-1 py-2 text-xs font-black rounded-xl transition-all bg-red-600 text-white shadow-lg shadow-red-900/40";
                } else {
                    btn.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all text-zinc-400 hover:text-white";
                }
            });

            renderitzarLlista();
        }

        function renderitzarLlista() {
            const container = document.getElementById('llista-esdeveniments');
            container.innerHTML = '';

            const llista = dades[categoriaActual] || [];

            if (llista.length === 0) {
                container.innerHTML = `<p class="text-center text-zinc-500 text-sm font-semibold py-8">No hi ha esdeveniments en aquesta categoria.</p>`;
                return;
            }

            llista.forEach(item => {
                const jaFeta = esEsdevenimentPassat(item.data);
                
                const badge = jaFeta ? 
                    `<span class="bg-red-950 text-red-400 border border-red-800/50 text-[8px] font-black px-2 py-0.5 rounded-full uppercase">Finalitzada</span>` : 
                    `<span class="bg-emerald-950 text-emerald-400 border border-emerald-800/50 text-[8px] font-black px-2 py-0.5 rounded-full uppercase due-pulse">Propera</span>`;

                const card = document.createElement('div');
                // Requadre fosc (bg-zinc-900) amb vora esquerra vermella (border-l-red-600)
                card.className = `cursa-card rounded-3xl shadow-lg border-l-[12px] border-l-red-600 p-5 bg-zinc-900 border-t border-r border-b border-zinc-800/80`;
                
                const mapsClass = !item.maps ? "btn-disabled" : "";
                const webClass = !item.web ? "btn-disabled" : "";
                const pdfClass = !item.pdf ? "btn-disabled" : "";
                const fotosClass = !item.fotos ? "btn-disabled" : "";

                card.innerHTML = `
                    <div class="mb-4">
                        <div class="flex justify-between items-start">
                            <p class="text-zinc-400 font-black text-[10px] uppercase tracking-widest">${item.data || "Pendent de data"}</p>
                            ${badge}
                        </div>
                        <h2 class="text-xl font-bold text-white leading-tight mt-1">${item.nom}</h2>
                        <p class="text-zinc-400 text-xs font-bold mt-1 uppercase tracking-tight">📍 ${item.lloc || "Per determinar"}</p>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <!-- BOTÓ MAPS -->
                        <a href="${item.maps}" target="_blank" class="${mapsClass} flex flex-col items-center justify-center bg-red-600 hover:bg-red-700 text-white py-3 rounded-2xl shadow-lg shadow-red-950/50 transition-colors">
                            <span class="text-lg">📍</span>
                            <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Com anar-hi</span>
                        </a>
                        
                        <!-- BOTÓ INFO WEB -->
                        <a href="${item.web}" target="_blank" class="${webClass} flex flex-col items-center justify-center bg-zinc-800 hover:bg-zinc-700 text-white py-3 rounded-2xl shadow-lg border border-zinc-700/50 transition-colors">
                            <span class="text-lg">🌐</span>
                            <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Inscripció</span>
                        </a>

                        <!-- BOTÓ PDF (Instruccions) -->
                        <a href="${item.pdf}" target="_blank" class="${pdfClass} flex flex-col items-center justify-center bg-zinc-800 hover:bg-zinc-700 text-amber-400 py-3 rounded-2xl shadow-lg border border-zinc-700/50 transition-colors">
                            <span class="text-lg">📄</span>
                            <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Convocatòria</span>
                        </a>

                        <!-- BOTÓ FOTOS -->
                        <a href="${item.fotos}" target="_blank" class="${fotosClass} flex flex-col items-center justify-center bg-zinc-800 hover:bg-zinc-700 text-emerald-400 py-3 rounded-2xl shadow-lg border border-zinc-700/50 transition-colors">
                            <span class="text-lg">📸</span>
                            <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Fotos Cursa</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        canviarCategoria('copa');
    </script>
</body>
</html>
