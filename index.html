<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Júnior 2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icona de la bicicleta vermella i negre -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/512/DC2626/bicycle.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/DC2626/bicycle.png">
    <meta name="theme-color" content="#000000">

    <style>
        .cursa-card { transition: all 0.2s; }
        .cursa-card:active { transform: scale(0.98); }
        .btn-disabled { opacity: 0.2; filter: grayscale(1); pointer-events: none; }
        .due-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-100 pb-10 font-sans text-slate-900">

    <div class="max-w-md mx-auto">
        <!-- Capçalera -->
        <header class="bg-red-600 text-white p-6 shadow-lg text-center rounded-b-3xl">
            <h1 class="text-2xl font-black tracking-wider text-white uppercase leading-none">CC Sant Boi Autovivo</h1>
            <p class="text-[10px] font-bold opacity-90 uppercase tracking-[0.2em] mt-2">Junior</p>
            <p class="text-[10px] font-bold opacity-90 uppercase tracking-[0.2em] mt-2">Temporada 2027</p>
        </header>

        <!-- Navegació per Categories (Tabs) -->
        <nav class="flex justify-around bg-white mx-4 mt-4 p-1.5 rounded-2xl shadow-sm border border-slate-200">
            <button onclick="canviarCategoria('entrenaments')" id="tab-entrenaments" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-500">
                🏋️ Entrenaments
            </button>
            <button onclick="canviarCategoria('copa')" id="tab-copa" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-500">
                🏆 Copa Catalana
            </button>
            <button onclick="canviarCategoria('sortides')" id="tab-sortides" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-500">
                🚴 Sortides
            </button>
        </nav>

        <!-- Contenidor de Llista de Curses / Esdeveniments -->
        <div id="llista-esdeveniments" class="px-4 space-y-5 mt-5">
            <!-- Es genera automàticament -->
        </div>
    </div>

    <script>
        // --- DADES DE LES CATEGORIES ---
        const dades = {
            entrenaments: [
                // Exemple d'entrenament (pots afegir o modificar els teus)
                {
                    data: "18/10/2026",
                    nom: "Primera convocatòria",
                    lloc: "Sant Boi de Llobregat",
                    maps: "https://maps.app.goo.gl/6YYsCHeQjyoAo7dz8",
                    web: "",
                    pdf: "https://hipocamp.github.io/santboi-autovivo-junior2027/primera_convocatoria.pdf",
                    fotos: ""
                }
            ],
            copa: [
                // Exemple de copa (pots afegir o modificar els teus)
                { 
                    data: "", 
                    nom: "Per determinar", 
                    lloc: "",
                    maps: "https://maps.google.com",
                    web: "https://www.ciclisme.cat/",
                    pdf: "",
                    fotos: ""
                }
            ],
            sortides: [
                // Exemple de sortida social o ruta
                {
                    data: "",
                    nom: "Per determinar",
                    lloc: "",
                    maps: "https://maps.google.com",
                    web: "",
                    pdf: "",
                    fotos: ""
                }
            ],
        };

        let categoriaActual = 'copa'; // Categoria inicial per defecte

        function esEsdevenimentPassat(dataString) {
            const [dia, mes, any] = dataString.split('/');
            const dataEsdeveniment = new Date(any, mes - 1, dia);
            const avui = new Date();
            avui.setHours(0,0,0,0);
            return dataEsdeveniment < avui;
        }

        function canviarCategoria(categoria) {
            categoriaActual = categoria;
            
            // Actualitzar estil de les pestanyes
            ['entrenaments', 'copa', 'sortides'].forEach(cat => {
                const btn = document.getElementById(`tab-${cat}`);
                if (cat === categoria) {
                    btn.className = "flex-1 py-2 text-xs font-black rounded-xl transition-all bg-black-600 text-white shadow-md";
                } else {
                    btn.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all text-slate-500 hover:text-slate-800";
                }
            });

            renderitzarLlista();
        }

        function renderitzarLlista() {
            const container = document.getElementById('llista-esdeveniments');
            container.innerHTML = '';

            const llista = dades[categoriaActual] || [];

            if (llista.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 text-sm font-semibold py-8">No hi ha esdeveniments en aquesta categoria.</p>`;
                return;
            }

            llista.forEach(item => {
                const jaFeta = esEsdevenimentPassat(item.data);
                
                const colorBorda = jaFeta ? "border-red-500 bg-red-50/20" : "border-green-500 bg-white";
                const badge = jaFeta ? 
                    `<span class="bg-red-100 text-red-600 text-[8px] font-black px-2 py-0.5 rounded-full uppercase">Finalitzada</span>` : 
                    `<span class="bg-green-100 text-green-600 text-[8px] font-black px-2 py-0.5 rounded-full uppercase due-pulse">Propera</span>`;

                const card = document.createElement('div');
                card.className = `cursa-card rounded-3xl shadow-sm border-l-[12px] p-5 ${colorBorda} border border-slate-200`;
                
                const mapsClass = !item.maps ? "btn-disabled" : "";
                const webClass = !item.web ? "btn-disabled" : "";
                const pdfClass = !item.pdf ? "btn-disabled" : "";
                const fotosClass = !item.fotos ? "btn-disabled" : "";

                card.innerHTML = `
                    <div class="mb-4">
                        <div class="flex justify-between items-start">
                            <p class="text-slate-500 font-black text-[10px] uppercase tracking-widest">${item.data}</p>
                            ${badge}
                        </div>
                        <h2 class="text-xl font-bold text-slate-800 leading-tight mt-1">${item.nom}</h2>
                        <p class="text-slate-400 text-xs font-bold mt-1 uppercase tracking-tight">📍 ${item.lloc}</p>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <!-- BOTÓ MAPS -->
                        <a href="${item.maps}" target="_blank" class="${mapsClass} flex flex-col items-center justify-center bg-red-500 text-white py-3 rounded-2xl shadow-lg shadow-blue-100">
                            <span class="text-lg">📍</span>
                            <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Com anar-hi</span>
                        </a>
                        
                        <!-- BOTÓ INFO WEB -->
                        <a href="${item.web}" target="_blank" class="${webClass} flex flex-col items-center justify-center bg-slate-800 text-white py-3 rounded-2xl shadow-lg shadow-slate-200">
                            <span class="text-lg">🌐</span>
                            <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Inscripció</span>
                        </a>

                        <!-- BOTÓ PDF (Instruccions) -->
                        <a href="${item.pdf}" target="_blank" class="${pdfClass} flex flex-col items-center justify-center bg-green-500 text-white py-3 rounded-2xl shadow-lg shadow-orange-100">
                            <span class="text-lg">📄</span>
                            <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Convocatòria</span>
                        </a>

                        <!-- BOTÓ FOTOS -->
                        <a href="${item.fotos}" target="_blank" class="${fotosClass} flex flex-col items-center justify-center bg-emerald-500 text-white py-3 rounded-2xl shadow-lg shadow-emerald-100">
                            <span class="text-lg">📸</span>
                            <span class="text-[9px] font-black uppercase mt-1 tracking-tighter">Fotos Cursa</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Carregar la categoria inicial en obrir la pàgina
        canviarCategoria('copa');
    </script>
</body>
</html>
